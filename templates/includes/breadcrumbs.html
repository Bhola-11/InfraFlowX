{% if breadcrumbs %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb mb-0 py-2 px-3 rounded-3" style="background-color: var(--bg-dark-secondary); font-size: 0.85rem;">
        <li class="breadcrumb-item"><a href="{% url 'analytics:dashboard' %}" class="text-info text-decoration-none"><i class="bi bi-house-door me-1"></i> Home</a></li>
        {% for crumb in breadcrumbs %}
            {% if forloop.last %}
                <li class="breadcrumb-item active text-white fw-semibold" aria-current="page">{{ crumb.title }}</li>
            {% else %}
                <li class="breadcrumb-item"><a href="{{ crumb.url }}" class="text-secondary text-decoration-none">{{ crumb.title }}</a></li>
            {% endif %}
        {% endfor %}
    </ol>
</nav>
{% endif %}
