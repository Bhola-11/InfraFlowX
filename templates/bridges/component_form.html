{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card-enterprise p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
                <h4 class="fw-bold text-white mb-0">{{ title }}</h4>
                <a href="javascript:history.back()" class="btn btn-enterprise-outline btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                    {% for field in form %}
                        <div class="col-12">
                            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-secondary">
                    <a href="javascript:history.back()" class="btn btn-enterprise-outline">Cancel</a>
                    <button type="submit" class="btn btn-enterprise-primary px-4 fw-bold">
                        <i class="bi bi-check2-circle me-1"></i> Save Component Check
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
